name: CI workflow
on: [push]
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Print node version 
        run: node --version
